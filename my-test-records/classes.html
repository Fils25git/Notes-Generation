<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Classes & Subjects</title>

<link rel="stylesheet"
      href="css/global.css">

<link rel="stylesheet"
      href="css/dashboard.css">

<link rel="stylesheet"
      href="css/responsive.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

.page-header {

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;

}

.page-header h1 {

    margin: 0;

}

.primary-btn {

    border: none;
    background: #2563eb;
    color: white;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;

}

.primary-btn:hover {

    opacity: .9;

}

.search-box {

    margin-bottom: 20px;

}

.search-box input {

    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-sizing: border-box;

}

.assignment-grid {

    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(260px, 1fr));

    gap: 18px;

}

.assignment-card {

    background: white;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);

}

.assignment-card h3 {

    margin: 0 0 8px;

}

.assignment-subject {

    font-size: 17px;
    font-weight: 600;
    margin-bottom: 8px;

}

.assignment-year {

    color: #666;
    font-size: 14px;

}

.assignment-students {

    margin-top: 12px;
    color: #555;

}

.card-actions {

    display: flex;
    gap: 8px;
    margin-top: 16px;

}

.card-actions button {

    border: none;
    padding: 8px 11px;
    border-radius: 7px;
    cursor: pointer;

}

.edit-btn {

    background: #e8f0ff;
    color: #2563eb;

}

.delete-btn {

    background: #fee2e2;
    color: #dc2626;

}


/* =====================================================
   MODAL
===================================================== */

.modal {

    position: fixed;
    inset: 0;

    background:
        rgba(0,0,0,.45);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 999;

}

.modal.show {

    display: flex;

}

.modal-box {

    background: white;

    width: 100%;
    max-width: 500px;

    border-radius: 14px;

    padding: 22px;

    box-sizing: border-box;

}

.modal-box h2 {

    margin-top: 0;

}

.form-group {

    margin-bottom: 16px;

}

.form-group label {

    display: block;

    margin-bottom: 6px;

    font-weight: 600;

}

.form-group select {

    width: 100%;

    padding: 11px;

    border: 1px solid #ddd;

    border-radius: 8px;

    box-sizing: border-box;

}

.modal-actions {

    display: flex;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 20px;

}

.secondary-btn {

    border: 1px solid #ddd;

    background: white;

    padding: 10px 15px;

    border-radius: 8px;

    cursor: pointer;

}

.danger-btn {

    border: none;

    background: #dc2626;

    color: white;

    padding: 10px 15px;

    border-radius: 8px;

    cursor: pointer;

}

.message {

    display: none;

    padding: 12px 15px;

    border-radius: 8px;

    margin-bottom: 18px;

}

.message.show {

    display: block;

}

.message.success {

    background: #dcfce7;
    color: #166534;

}

.message.error {

    background: #fee2e2;
    color: #991b1b;

}

.empty-state {

    text-align: center;
    padding: 50px 20px;
    color: #777;

}

</style>

</head>


<body>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar">

    <div class="sidebar-logo">
        <h2>Fila Assistant</h2>
    </div>

    <nav>

        <a href="dashboard.html">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
        </a>

        <a href="students.html">
            <i class="fa-solid fa-users"></i>
            Manage Students
        </a>

        <a href="classes.html" class="active">
            <i class="fa-solid fa-book"></i>
            Classes & Subjects
        </a>

        <a href="marks.html">
            <i class="fa-solid fa-pen"></i>
            Record Marks
        </a>

        <a href="results.html">
            <i class="fa-solid fa-chart-column"></i>
            Results
        </a>

    </nav>

</aside>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main-content">


    <div class="page-header">

        <div>

            <h1>
                Classes & Subjects
            </h1>

            <p>
                Select the subjects you teach in each class.
            </p>

        </div>


        <button
            class="primary-btn"
            onclick="openAddModal()">

            <i class="fa-solid fa-plus"></i>

            Add Teaching Class

        </button>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search class or subject..."
            oninput="renderAssignments()">

    </div>


    <div
        id="assignmentGrid"
        class="assignment-grid">
    </div>


</main>


<!-- =====================================================
     ADD MODAL
===================================================== -->

<div
    id="addModal"
    class="modal">

    <div class="modal-box">

        <h2>
            Add Teaching Class
        </h2>


        <div class="form-group">

            <label>
                Academic Year
            </label>

            <select
                id="addYear">
            </select>

        </div>


        <div class="form-group">

            <label>
                Class
            </label>

            <select
                id="addClass">
            </select>

        </div>


        <div class="form-group">

            <label>
                Subject
            </label>

            <select
                id="addSubject">
            </select>

        </div>


        <div class="modal-actions">

            <button
                class="secondary-btn"
                onclick="closeAddModal()">

                Cancel

            </button>


            <button
                class="primary-btn"
                onclick="saveAssignment()">

                Save

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     EDIT MODAL
===================================================== -->

<div
    id="editModal"
    class="modal">

    <div class="modal-box">

        <h2>
            Edit Teaching Class
        </h2>


        <input
            type="hidden"
            id="editId">


        <div class="form-group">

            <label>
                Academic Year
            </label>

            <select
                id="editYear">
            </select>

        </div>


        <div class="form-group">

            <label>
                Class
            </label>

            <select
                id="editClass">
            </select>

        </div>


        <div class="form-group">

            <label>
                Subject
            </label>

            <select
                id="editSubject">
            </select>

        </div>


        <div class="modal-actions">

            <button
                class="secondary-btn"
                onclick="closeEditModal()">

                Cancel

            </button>


            <button
                class="primary-btn"
                onclick="updateAssignment()">

                Update

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     DELETE MODAL
===================================================== -->

<div
    id="deleteModal"
    class="modal">

    <div class="modal-box">

        <h2>
            Remove Teaching Assignment
        </h2>


        <p id="deleteText">
            Are you sure?
        </p>


        <input
            type="hidden"
            id="deleteId">


        <div class="modal-actions">

            <button
                class="secondary-btn"
                onclick="closeDeleteModal()">

                Cancel

            </button>


            <button
                class="danger-btn"
                onclick="deleteAssignment()">

                Remove

            </button>

        </div>

    </div>

</div>


<script>


/* =====================================================
   CONFIG
===================================================== */

const API =
    "../.netlify/functions/student";


const teacherId =
    Number(
        localStorage.getItem("userId")
    );


if (!teacherId) {

    window.location.href =
        "../login.html";

}


/* =====================================================
   FRONTEND SUBJECT LIST
===================================================== */

const SUBJECTS = [

    "English",

    "Mathematics",

    "Kinyarwanda",

    "Science and Elementary Technology (SET)",

    "Social and Religious Studies (SRS)",

    "French",

    "Creative Arts",

    "Physical Education",

    "ICT",

    "Physics",

    "Chemistry",

    "Biology",

    "History",

    "Geography",

    "Entrepreneurship",

    "Computer Science"

];


/* =====================================================
   DATA
===================================================== */

let assignments = [];

let classes = [];

let academicYears = [];


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type = "success"
) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent = text;

    message.className =
        "message show " + type;


    setTimeout(() => {

        message.className =
            "message";

    }, 3500);

}


/* =====================================================
   API
===================================================== */

async function api(
    action,
    options = {}
) {

    let url =
        `${API}?action=${encodeURIComponent(action)}&teacher_id=${teacherId}`;


    if (options.method === "POST") {

        const response =
            await fetch(
                url,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            ...options.body,
                            teacher_id:
                                teacherId
                        })
                }
            );

        return await response.json();

    }


    const response =
        await fetch(url);

    return await response.json();

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData() {

    try {

        const [
            assignmentResponse,
            classResponse,
            yearResponse
        ] = await Promise.all([

            api(
                "getTeachingAssignments"
            ),

            api(
                "getClasses"
            ),

            api(
                "getAcademicYears"
            )

        ]);


        if (
            !assignmentResponse.success
        ) {

            throw new Error(
                assignmentResponse.message
            );

        }


        if (
            !classResponse.success
        ) {

            throw new Error(
                classResponse.message
            );

        }


        if (
            !yearResponse.success
        ) {

            throw new Error(
                yearResponse.message
            );

        }


        assignments =
            assignmentResponse.assignments || [];


        classes =
            classResponse.classes || [];


        academicYears =
            yearResponse.years || [];


        populateAllSelects();

        renderAssignments();


    } catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Failed to load data.",
            "error"
        );

    }

}


/* =====================================================
   POPULATE SELECTS
===================================================== */

function populateAllSelects() {

    populateYears(
        document.getElementById("addYear")
    );

    populateYears(
        document.getElementById("editYear")
    );


    populateClasses(
        document.getElementById("addClass")
    );

    populateClasses(
        document.getElementById("editClass")
    );


    populateSubjects(
        document.getElementById("addSubject")
    );

    populateSubjects(
        document.getElementById("editSubject")
    );

}


/* =====================================================
   YEARS
===================================================== */

function populateYears(select) {

    select.innerHTML =
        '<option value="">Select academic year</option>';


    academicYears.forEach(
        year => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                year.id;

            option.textContent =
                year.year_name;

            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   CLASSES
===================================================== */

function populateClasses(select) {

    select.innerHTML =
        '<option value="">Select class</option>';


    classes.forEach(
        item => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                item.id;

            option.textContent =
                item.class_name;

            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   SUBJECTS
===================================================== */

function populateSubjects(select) {

    select.innerHTML =
        '<option value="">Select subject</option>';


    SUBJECTS.forEach(
        subject => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                subject;

            option.textContent =
                subject;

            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   RENDER ASSIGNMENTS
===================================================== */

function renderAssignments() {

    const grid =
        document.getElementById(
            "assignmentGrid"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const filtered =
        assignments.filter(
            item => {

                const text = (

                    item.class_name +
                    " " +
                    item.subject_name +
                    " " +
                    item.year_name

                ).toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    if (!filtered.length) {

        grid.innerHTML = `

            <div class="empty-state">

                <i
                    class="fa-solid fa-book-open"
                    style="font-size:40px;">
                </i>

                <h3>
                    No teaching assignments
                </h3>

                <p>
                    Add the subjects you teach
                    in your classes.
                </p>

            </div>

        `;

        return;

    }


    grid.innerHTML =
        filtered.map(
            item => `

                <div
                    class="assignment-card">

                    <h3>
                        ${escapeHtml(
                            item.class_name
                        )}
                    </h3>

                    <div
                        class="assignment-subject">

                        ${escapeHtml(
                            item.subject_name
                        )}

                    </div>

                    <div
                        class="assignment-year">

                        Academic Year:
                        ${escapeHtml(
                            item.year_name
                        )}

                    </div>

                    <div
                        class="assignment-students">

                        <i class="fa-solid fa-users">
                        </i>

                        ${item.student_count || 0}
                        students

                    </div>


                    <div
                        class="card-actions">

                        <button
                            class="edit-btn"
                            onclick="openEditModal(${item.id})">

                            <i
                                class="fa-solid fa-pen">
                            </i>

                            Edit

                        </button>


                        <button
                            class="delete-btn"
                            onclick="openDeleteModal(${item.id})">

                            <i
                                class="fa-solid fa-trash">
                            </i>

                            Remove

                        </button>

                    </div>

                </div>

            `
        ).join("");

}


/* =====================================================
   ADD MODAL
===================================================== */

function openAddModal() {

    document.getElementById(
        "addYear"
    ).value = "";

    document.getElementById(
        "addClass"
    ).value = "";

    document.getElementById(
        "addSubject"
    ).value = "";


    /*
       Automatically select the
       current academic year.
    */

    const currentYear =
        academicYears.find(
            year =>
                year.is_current === true
        );


    if (currentYear) {

        document.getElementById(
            "addYear"
        ).value =
            currentYear.id;

    }


    document.getElementById(
        "addModal"
    ).classList.add("show");

}


function closeAddModal() {

    document.getElementById(
        "addModal"
    ).classList.remove("show");

}


/* =====================================================
   SAVE ASSIGNMENT
===================================================== */

async function saveAssignment() {

    const academicYearId =
        Number(
            document.getElementById(
                "addYear"
            ).value
        );


    const classId =
        Number(
            document.getElementById(
                "addClass"
            ).value
        );


    const subjectName =
        document.getElementById(
            "addSubject"
        ).value;


    if (!academicYearId) {

        showMessage(
            "Please select an academic year.",
            "error"
        );

        return;

    }


    if (!classId) {

        showMessage(
            "Please select a class.",
            "error"
        );

        return;

    }


    if (!subjectName) {

        showMessage(
            "Please select a subject.",
            "error"
        );

        return;

    }


    try {

        const result =
            await api(
                "addTeachingAssignment",
                {
                    method: "POST",

                    body: {
                        academic_year_id:
                            academicYearId,

                        class_id:
                            classId,

                        subject_name:
                            subjectName
                    }
                }
            );


        if (!result.success) {

            throw new Error(
                result.message
            );

        }


        closeAddModal();

        showMessage(
            "Teaching assignment added successfully."
        );


        await loadData();


    } catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Failed to add assignment.",
            "error"
        );

    }

}


/* =====================================================
   EDIT MODAL
===================================================== */

function openEditModal(id) {

    const item =
        assignments.find(
            assignment =>
                Number(
                    assignment.id
                ) === Number(id)
        );


    if (!item) {

        showMessage(
            "Assignment not found.",
            "error"
        );

        return;

    }


    document.getElementById(
        "editId"
    ).value =
        item.id;


    document.getElementById(
        "editYear"
    ).value =
        item.academic_year_id;


    document.getElementById(
        "editClass"
    ).value =
        item.class_id;


    document.getElementById(
        "editSubject"
    ).value =
        item.subject_name;


    document.getElementById(
        "editModal"
    ).classList.add("show");

}


function closeEditModal() {

    document.getElementById(
        "editModal"
    ).classList.remove("show");

}


/* =====================================================
   UPDATE ASSIGNMENT
===================================================== */

async function updateAssignment() {

    const id =
        Number(
            document.getElementById(
                "editId"
            ).value
        );


    const academicYearId =
        Number(
            document.getElementById(
                "editYear"
            ).value
        );


    const classId =
        Number(
            document.getElementById(
                "editClass"
            ).value
        );


    const subjectName =
        document.getElementById(
            "editSubject"
        ).value;


    if (!id ||
        !academicYearId ||
        !classId ||
        !subjectName) {

        showMessage(
            "Please complete all fields.",
            "error"
        );

        return;

    }


    try {

        const result =
            await api(
                "updateTeachingAssignment",
                {
                    method: "POST",

                    body: {
                        id,

                        academic_year_id:
                            academicYearId,

                        class_id:
                            classId,

                        subject_name:
                            subjectName
                    }
                }
            );


        if (!result.success) {

            throw new Error(
                result.message
            );

        }


        closeEditModal();

        showMessage(
            "Teaching assignment updated successfully."
        );


        await loadData();


    } catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Failed to update assignment.",
            "error"
        );

    }

}


/* =====================================================
   DELETE MODAL
===================================================== */

function openDeleteModal(id) {

    const item =
        assignments.find(
            assignment =>
                Number(
                    assignment.id
                ) === Number(id)
        );


    if (!item) {

        showMessage(
            "Assignment not found.",
            "error"
        );

        return;

    }


    document.getElementById(
        "deleteId"
    ).value =
        item.id;


    document.getElementById(
        "deleteText"
    ).textContent =
        `Remove ${item.subject_name} from ${item.class_name}? Existing students and marks will not be deleted.`;


    document.getElementById(
        "deleteModal"
    ).classList.add("show");

}


function closeDeleteModal() {

    document.getElementById(
        "deleteModal"
    ).classList.remove("show");

}


/* =====================================================
   DELETE ASSIGNMENT
===================================================== */

async function deleteAssignment() {

    const id =
        Number(
            document.getElementById(
                "deleteId"
            ).value
        );


    if (!id) {

        return;

    }


    try {

        const result =
            await api(
                "deleteTeachingAssignment",
                {
                    method: "POST",

                    body: {
                        id
                    }
                }
            );


        if (!result.success) {

            throw new Error(
                result.message
            );

        }


        closeDeleteModal();

        showMessage(
            "Teaching assignment removed successfully."
        );


        await loadData();


    } catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Failed to remove assignment.",
            "error"
        );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   CLOSE MODALS WHEN CLICKING OUTSIDE
===================================================== */

window.addEventListener(
    "click",
    event => {

        if (
            event.target.classList.contains(
                "modal"
            )
        ) {

            event.target.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

loadData();

</script>

</body>

                </html>
